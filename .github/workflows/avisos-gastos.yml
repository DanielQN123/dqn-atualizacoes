name: Avisos de vencimento (Meus Gastos)

# Todo dia às 07:47 (horário de Brasília) envia notificação das contas que vencem em 3 dias,
# hoje ou venceram ontem. Precisa do segredo FIREBASE_SERVICE_ACCOUNT no repositório.
# Obs.: o GitHub só roda agendamentos que estão no branch principal (main).
on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o que seria enviado (não envia)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avisos-gastos

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app-gastos/avisos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-gastos/avisos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node enviar.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://danielqn123.github.io/dqn-atualizacoes/app-gastos/
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
